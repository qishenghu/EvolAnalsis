hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

# ============================================================================
# 7.1 + 7.7-v3c (CVaR-logp robust confidence + LOGPROB gate) — retuned threshold
#
# What happened in run 4snkb9jg:
# - teacher_diag/seq_beta/logC_alpha(mean) jumped to ~ -5.7 -> -3.6 in first 2 steps
# - with logc0=-13, gate = sigmoid((logC - logc0)/T) ≈ sigmoid(7~10) ≈ 1
#   -> beta saturated to beta_max (~0.35) from step1 (teacher already weakened)
#
# Fix:
# - move logc0 into the observed logC regime (around -3~-4), so β is NOT saturated.
# - keep beta_min=0.05 to preserve early teacher boost.
# - use CVaR (bottom-q logp mean) as robust tail-aware confidence.
#
# Monitor (wandb):
# - teacher_diag/seq_beta/logC_robust/mean (should be ~ -6..-2 early, move upward)
# - teacher_diag/seq_beta/beta/mean       (should start near ~0.05-0.12 then rise)
# - teacher_diag/teacher_ratio/mean       (should not stay overly high in mid/late)
# ============================================================================

trainer:
  experiment_name: alfworld_3b_grpo_teacher72b_only_bz8_mix1_no_logprob_random__baseline_sep_plus_seq_beta_77_logprob_best_v3c
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 1
  save_freq: 100
  test_freq: 25
  val_before_train: false
  validation_data_dir: "experiments/alfworld/${trainer.experiment_name}/validation_log"
  rollout_data_dir: "experiments/alfworld/${trainer.experiment_name}/rollout_log"
  logger: ["console", "wandb"]

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  grpo:
    teacher_baseline_separation:
      enable: true
      teacher_baseline: "all_mean"
      non_teacher_baseline: "non_teacher_mean"
      std_source: "non_teacher"

  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: "strict"
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: "additive"

actor_rollout_ref:
  model:
    path: /data/code/exp/models/Qwen/Qwen2.5-3B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1e-6
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean

    # Off-policy (self-generated) shaping
    off_policy_shaping_mode: "exgrpo_policy_shaping"
    off_policy_shaping_beta: 0.1

    # Teacher (LUFFY)
    teacher_use_log_prob: ${exp_manager.teacher_experience.use_log_prob}
    teacher_policy_shaping_enable: ${exp_manager.teacher_experience.policy_shaping.enable}
    teacher_policy_shaping_mode: ${exp_manager.teacher_experience.policy_shaping.mode}
    teacher_policy_shaping_beta: ${exp_manager.teacher_experience.policy_shaping.beta}
    teacher_use_clip: false

    # ⭐ 7.7: robust seq-beta schedule
    teacher_seq_beta_enable: ${exp_manager.teacher_experience.seq_beta_77.enable}
    teacher_seq_beta_alpha: ${exp_manager.teacher_experience.seq_beta_77.alpha}
    teacher_seq_beta_c0: ${exp_manager.teacher_experience.seq_beta_77.c0}
    teacher_seq_beta_temperature: ${exp_manager.teacher_experience.seq_beta_77.temperature}
    teacher_seq_beta_gate_space: ${exp_manager.teacher_experience.seq_beta_77.gate_space}
    teacher_seq_beta_logc0: ${exp_manager.teacher_experience.seq_beta_77.logc0}
    teacher_seq_beta_log_temperature: ${exp_manager.teacher_experience.seq_beta_77.log_temperature}
    teacher_seq_beta_conf_mode: ${exp_manager.teacher_experience.seq_beta_77.conf_mode}
    teacher_seq_beta_logp_q: ${exp_manager.teacher_experience.seq_beta_77.logp_q}
    teacher_seq_beta_max_tokens_per_traj: ${exp_manager.teacher_experience.seq_beta_77.max_tokens_per_traj}
    teacher_seq_beta_beta_min: ${exp_manager.teacher_experience.seq_beta_77.beta_min}
    teacher_seq_beta_beta_max: ${exp_manager.teacher_experience.seq_beta_77.beta_max}
    teacher_seq_beta_p_min: ${exp_manager.teacher_experience.seq_beta_77.p_min}
    teacher_seq_beta_stop_grad: ${exp_manager.teacher_experience.seq_beta_77.stop_grad}

    # Disable other gates (keep experiment clean)
    teacher_ag_pm_enable: false
    teacher_adv_gate_enable: false
    teacher_token_gate_enable: false
    teacher_entropy_gate_enable: false

    use_dapo: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    use_qwen3: false
    enable_request_id: false
    prompt_length: 20480
    response_length: 2048
    max_model_len: 25580
    temperature: 0.9
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: vllm
    mode: async
    gpu_memory_utilization: 0.5
    n: 8
    log_prob_max_token_len_per_gpu: 25580

critic:
  ppo_max_token_len_per_gpu: 25580
  forward_max_token_len_per_gpu: 25580

data:
  train_batch_size: 8
  max_prompt_length: 4000
  max_response_length: 21580
  filter_overlong_prompts: true
  truncation: "error"
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: "val"
  max_train_tasks: 800
  shuffle: true

env_service:
  env_type: "alfworld"
  env_url: "http://127.0.0.1:8081"

task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/alfworld.json

exp_manager:
  train_rollout_mode: "woexp"
  val_rollout_mode: "woexp"
  rollout_ratio: 0
  train_sample_mode: "alldiscard"
  train_sample_keepratio: 0.0
  experience_template: "\n\nSome Related Experience to help you to complete the task:<EXP>{}</EXP>\n\n"

  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8

  experience_replay:
    enable: false
    replay_start_ratio: 0.1
    exp_ratio: 0.0
    offpolicy_trajectories_per_task: 1
    experience_lbound: 2
    experience_rbound: 8
    exp_select_mode: "argmin"
    use_current_policy_entropy: true
    exp_is_correct: true
    max_trajectories_per_task: 5

  teacher_experience:
    enable: true
    mix_mode: "rollout_level"
    data_path: "data/teacher_trajectories/qwen72b/alfworld_qwen72b_filtered.pkl"
    n_teacher_rollouts_per_task: 1
    max_trajectories_per_task: 6
    select_mode: "random"
    use_log_prob: false
    policy_shaping:
      enable: true
      mode: "p_div_p_beta"
      beta: 0.1

    seq_beta_77:
      enable: true
      alpha: -2.0
      conf_mode: "cvar_logp"
      logp_q: 0.10
      max_tokens_per_traj: 2048
      gate_space: "logprob"
      # Retuned threshold (avoid gate saturation to 1 at step1)
      # Further retune based on early steps (logC often in [-8,-4]):
      # - lower logc0: make gate more sensitive around mid-phase (-4ish), so β can rise earlier
      # - increase log_temperature: smooth gate to avoid abrupt per-step saturation
      logc0: -4.2
      log_temperature: 1.0
      # legacy (ignored in logprob mode)
      c0: 0.25
      temperature: 0.05
      beta_min: 0.05
      beta_max: 0.35
      p_min: 1e-8
      stop_grad: true

attribution_driven_credit_assignment:
  enable: false

thread_pool:
  max_workers: 64
  enable_memory_protection: true
  memory_threshold: 0.9
  cool_down_time: 30


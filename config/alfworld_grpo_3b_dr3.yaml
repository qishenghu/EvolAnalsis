hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

# ============================================================================
# AlfWorld GRPO Training Configuration with DR³ (Density-Ratio-Repair)
# ============================================================================
# 目标：
# - teacher tokenizer 不同 / 拿不到 teacher logprob 时，使用相对密度比 w_alpha 做 off-policy 修复
# - 不使用 CHORD 的 SFT 凸组合；也不使用 LUFFY 的 policy shaping（默认关闭）
# - 保持对现有算法的兼容：仅当 actor.use_dr3=true 时启用
# ============================================================================

trainer:
  experiment_name: alfworld_3b_grpo_dr3_teacher72b_bz8_ntr1
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 1
  save_freq: 100
  test_freq: 50
  val_before_train: false
  validation_data_dir: "experiments/alfworld/${trainer.experiment_name}/validation_log"
  rollout_data_dir: "experiments/alfworld/${trainer.experiment_name}/rollout_log"
  logger: ["console", "wandb"]

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  # 可选：若你想让 teacher 不污染 on-policy baseline，可启用 separation
  grpo:
    teacher_baseline_separation:
      enable: true
      teacher_baseline: "all_mean"
      non_teacher_baseline: "non_teacher_mean"
      std_source: "non_teacher"
  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: "strict"
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: "additive"

actor_rollout_ref:
  model:
    path: /data/code/exp/models/Qwen/Qwen2.5-3B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1e-6
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean

    # =========================================================================
    # DR³ 开关与参数（仅影响 actor 更新逻辑）
    # =========================================================================
    use_dr3: true
    dr3:
      enable: true
      apply_to: "teacher_no_logprob"     # "teacher_no_logprob" | "all_offpolicy"
      # Stronger default: avoid advantage leakage into discriminator (better theory + often better behavior).
      feature_mode: "v3"                # "v1" | "v2" | "v3"(no-adv)
      # Optional warmup: only observe+train D for first N steps; start applying repair after that.
      # This can reduce early-step noise when buffer/discriminator is not yet stable.
      apply_warmup_steps: 10
      # Optional extra gate: require buffer size >= this value before applying repair.
      apply_min_buf_size: 256
      # α selection:
      # - If you set alpha_prior, DR³ will always use it (stable but may be biased when teacher rollouts are missing).
      # - Recommended stronger default: estimate α from actual (sync'ed) on/off ratio + EMA smoothing.
      # alpha_prior: 0.125
      alpha_mode: "sync_batch_ema"       # "sync_batch_ema" | "sync_batch" | "buffer_ema" | "buffer" | "micro"
      alpha_ema_beta: 0.9
      # discriminator
      disc_hidden: 64
      disc_lr: 5e-4
      disc_steps_per_call: 4
      buffer_size: 2048
      train_batch_size: 128
      ess_window: 32
      # Multi-GPU robustness: gather micro-batch features/labels across ranks so every rank sees both classes.
      sync_across_ranks: true
      sync_every_n_calls: 1
      # Train discriminator only on rank0, then broadcast params to all ranks.
      broadcast_params: true
      broadcast_every_n_calls: 1
      # ratio clipping / stability
      clip_max: 10.0
      ppo_clip_eps: 0.2                  # reuse PPO-style clip for off-policy ratio after repair
      # Early acceleration: during first N steps, use ExGRPO/LUFFY-style shaping on repaired ratio (w_hat)
      # f(w)=w/(w+beta), no clipping on off-policy branch during this phase.
      # ratio_shaping_mode:
      # - "step": enable for first ratio_shaping_steps steps
      # - "auto": closed-loop; enable until disc/buffer/ESS are stable enough, then automatically turn off
      # - "always": always enable (not recommended for protecting asymptotic)
      # - "off": disable
      ratio_shaping_mode: "auto"
      ratio_shaping_beta: 0.1
      # closed-loop thresholds (only used when ratio_shaping_mode="auto")
      ratio_shaping_auto_acc_min: 0.85
      ratio_shaping_auto_buf_min: 512
      ratio_shaping_auto_ess_min: 16.0
      # closed-loop dual ESS
      dual_enable: true
      ess_target_ratio: 0.5
      dual_lr: 0.05
      dual_init: 0.0

    # 禁用 CHORD
    use_chord: false
    # 禁用 LUFFY shaping（DR³ 不需要；否则会引入额外 bias）
    teacher_use_log_prob: false
    teacher_policy_shaping_enable: false
    teacher_use_clip: false

    use_dapo: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true

  rollout:
    use_qwen3: false
    enable_request_id: false
    prompt_length: 20480
    response_length: 2048
    max_model_len: 25580
    temperature: 0.9
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: vllm
    mode: async
    gpu_memory_utilization: 0.5
    n: 8
    log_prob_max_token_len_per_gpu: 25580
    val_kwargs:
      n: 1
    max_env_worker: 32
    context_template: "linear"
    context_template_train_sp_action: false
    max_env_len: 4096
    sparse: true
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 30
      tool_config_path: ""
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 25580

critic:
  ppo_max_token_len_per_gpu: 25580
  forward_max_token_len_per_gpu: 25580

data:
  train_batch_size: 8
  max_prompt_length: 4000
  max_response_length: 21580
  filter_overlong_prompts: true
  truncation: "error"
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: "val"
  max_train_tasks: 800
  shuffle: true

env_service:
  env_type: "alfworld"
  env_url: "http://127.0.0.1:8081"

task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/alfworld.json

exp_manager:
  train_rollout_mode: "woexp"
  val_rollout_mode: "woexp"
  rollout_ratio: 0
  train_sample_mode: "alldiscard"
  train_sample_keepratio: 0.0
  experience_template: "\n\nSome Related Experience to help you to complete the task:<EXP>{}</EXP>\n\n"

  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  reme:
    base_url: "http://127.0.0.1:8124"
    workspace_id: "alfworld_3b_grpo_dr3"
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0

  experience_replay:
    enable: false

  # Teacher experience（DR³ 依赖 teacher data 的混入，但不需要 teacher logprob）
  teacher_experience:
    enable: true
    mix_mode: "rollout_level"
    data_path: "data/teacher_trajectories/qwen72b/alfworld_qwen72b_filtered.pkl"
    n_teacher_rollouts_per_task: 1
    max_trajectories_per_task: 6
    select_mode: "random"
    use_log_prob: false
    policy_shaping:
      enable: false
      mode: "p_div_p_beta"
      beta: 0.1

attribution_driven_credit_assignment:
  enable: false

thread_pool:
  max_workers: 8


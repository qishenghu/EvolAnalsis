hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

# ============================================================================
# SciWorld GRPO Training Configuration with DR³ + Hidden Feature Discriminator
# ============================================================================
# This config is derived from `config/alfworld_grpo_3b_dr3_hidden.yaml` with only
# SciWorld-specific fields changed (env, env_profile, max_steps, log dirs, teacher data path).
# ============================================================================

trainer:
  experiment_name: sciworld_7b_grpo_dr3_v3aug_teacher72b_bz8_ntr1_gap_gate_standard0
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 1
  save_freq: 100
  test_freq: 50
  val_before_train: false
  validation_data_dir: "experiments/sciworld/${trainer.experiment_name}/validation_log"
  rollout_data_dir: "experiments/sciworld/${trainer.experiment_name}/rollout_log"
  logger: ["console", "wandb"]

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  grpo:
    teacher_baseline_separation:
      enable: true
      teacher_baseline: "all_mean"
      non_teacher_baseline: "non_teacher_mean"
      std_source: "non_teacher"
  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: "strict"
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: "additive"

actor_rollout_ref:
  model:
    path: /data/code/exp/models/Qwen/Qwen2.5-7B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1e-6
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean

    # =========================================================================
    # DR³
    # =========================================================================
    use_dr3: true
    dr3:
      enable: true
      apply_to: "teacher_no_logprob"

      # ⭐ Use augmented v3 features (no hidden states; less overfit than v5_hidden)
      # v3_aug = v3(no-adv) + richer logprob/kl shape features (still cheap; no reward leakage).
      feature_mode: "v3_aug"
      # ⭐ NEW: reward-gap gate (explicit teacher fade-out)
      # Uses trainer-computed `diag/group_teacher_minus_on_reward_mean` to produce `teacher_loss_scale` in [0,1],
      # then actor scales teacher-token advantages by this gate during DR³ apply.
      # Intuition: early gap is large → gate≈1; late gap shrinks → gate→0 to protect asymptotic performance.
      gap_gate_enable: true
      # v5_hidden: project pooled hidden (H) -> hidden_proj_dim before feeding discriminator MLP
      hidden_proj_dim: 64
      hidden_proj_dropout: 0.2
      disc_weight_decay: 0.005
      # Only applied when feature_mode contains "hidden" (v5_hidden): soften labels to avoid early saturation.
      disc_label_smoothing: 0.05
      # B1: Temperature scaling for discriminator output (>1 → softer D, reduces overconfidence)
      # Typical values: 1.5~2.0 when using hidden features
      disc_temperature: 1.2
      # A1: Age-weighted loss for discriminator (decay factor per step, 0=disabled)
      # Newer samples get higher weight, reduces θ-drift impact
      # Typical values: 0.02~0.1 (weight halves every ~35 steps @ 0.02, ~7 steps @ 0.1)
      disc_age_weight_decay: 0.02

      apply_warmup_steps: 10
      # Avoid early discriminator overconfidence (esp. with balanced sampling):
      # require enough buffer so teacher samples are not heavily re-sampled.
      apply_min_buf_size: 512
      # Additionally, delay discriminator *training* (optimizer steps) until buffer is large enough.
      # (Buffer still collects samples before this threshold.)
      disc_train_min_buf_size: 256

      alpha_mode: "sync_batch_ema"
      alpha_ema_beta: 0.9

      disc_hidden: 64
      disc_lr: 3e-4
      disc_steps_per_call: 2
      buffer_size: 1024
      train_batch_size: 128
      ess_window: 32

      sync_across_ranks: true
      sync_every_n_calls: 1
      broadcast_params: true
      broadcast_every_n_calls: 1

      clip_max: 10.0
      ppo_clip_eps: 0.2

      ratio_shaping_mode: "auto"
      ratio_shaping_beta: 0.1
      ratio_shaping_auto_acc_min: 0.80
      ratio_shaping_auto_buf_min: 512
      ratio_shaping_auto_ess_min: 16.0

      dual_enable: true
      ess_target_ratio: 0.5
      dual_lr: 0.05
      dual_init: 0.0

    use_chord: false
    teacher_use_log_prob: false
    teacher_policy_shaping_enable: false
    teacher_use_clip: false

    use_dapo: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true

  rollout:
    use_qwen3: false
    enable_request_id: false
    prompt_length: 25068
    response_length: 512
    max_model_len: 25580
    temperature: 0.9
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: vllm
    mode: async
    gpu_memory_utilization: 0.5
    n: 8
    log_prob_max_token_len_per_gpu: 25580
    val_kwargs:
      n: 1
    max_env_worker: 32
    context_template: "linear"
    context_template_train_sp_action: false
    max_env_len: 4096
    sliding_window_size: 3  # keep last 3 LLM turns full, compress older to action-only
    sparse: true
    # SciWorld success threshold (raw score scale 0-100).
    # 0 = EPO-style (done AND score > 0); 70 = agl-envs strict (done AND score > 70).
    sciworld_success_threshold: 0
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 50
      tool_config_path: ""
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 25580

critic:
  ppo_max_token_len_per_gpu: 25580
  forward_max_token_len_per_gpu: 25580

data:
  train_batch_size: 8
  max_prompt_length: 1500
  max_response_length: 24080
  filter_overlong_prompts: true
  truncation: "error"
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: "val"
  max_train_tasks: 800
  shuffle: true
  seed: 2026

env_service:
  env_type: "sciworld"
  env_url: "http://127.0.0.1:8084"

task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/sciworld.json

exp_manager:
  train_rollout_mode: "woexp"
  val_rollout_mode: "woexp"
  rollout_ratio: 0
  train_sample_mode: "alldiscard"
  train_sample_keepratio: 0.0
  experience_template: "\n\nSome Related Experience to help you to complete the task:<EXP>{}</EXP>\n\n"

  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  reme:
    base_url: "http://127.0.0.1:8124"
    workspace_id: "sciworld_3b_grpo_dr3_hidden"
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0

  experience_replay:
    enable: false

  teacher_experience:
    enable: true
    mix_mode: "rollout_level"
    data_path: "data/teacher_trajectories/sciworld_gold_qwen72b_filtered_0309.pkl"
    n_teacher_rollouts_per_task: 1
    max_trajectories_per_task: 6
    select_mode: "random"
    use_log_prob: false
    policy_shaping:
      enable: false
      mode: "p_div_p_beta"
      beta: 0.1

    # ⭐ NEW: Adaptive teacher weight from reward-gap (writes `teacher_loss_scale` into batch)
    # This is consumed by DR³ reward-gap gate when dr3.gap_gate_enable=true.
    adaptive_weight:
      enable: true
      # current implementation supports: gap_linear
      mode: "gap_linear"
      # recommend "group" (per-task/per-uid) for stable fade-out; fallback to batch if grouping missing.
      gate_level: "group"
      # gate = clip((gap - epsilon) / tau, min, max)
      epsilon: 0.0
      # with rewards in [0,1], 0.5 keeps gate open longer than 0.3.
      tau: 0.50
      min: 0.0
      max: 1.0
      ema:
        enable: true
        # smoother gate to reduce jitter in early training
        beta: 0.95

attribution_driven_credit_assignment:
  enable: false

thread_pool:
  max_workers: 8


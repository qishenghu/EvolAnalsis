hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

# ============================================================================
# SciWorld GRPO Training Configuration with CHORD
# ============================================================================
# CHORD (Controllable Harmonization of On- and Off-Policy RL via Dynamic Weighting)
#
# 说明：由 `config/alfworld_grpo_3b_chord.yaml` 派生，仅替换 SciWorld 相关字段：
# - env_service/env_profile
# - multi_turn.max_steps
# - experiments 路径前缀
# - teacher_experience.data_path（expert 轨迹）
# - reme.workspace_id
# ============================================================================

trainer:
  experiment_name: sciworld_3b_grpo_chord_bz8_mix1_mu_decay_50_wo_kl_2400
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 1
  save_freq: 100
  test_freq: 50
  val_before_train: false
  validation_data_dir: "experiments/sciworld/${trainer.experiment_name}/validation_log"
  rollout_data_dir: "experiments/sciworld/${trainer.experiment_name}/rollout_log"
  logger: ["console", "wandb"]

# ============================================================================
# Algorithm Configuration
# ============================================================================
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  # CHORD 可以与 teacher_baseline_separation 配合使用
  grpo:
    teacher_baseline_separation:
      enable: true
      teacher_baseline: "all_mean"
      non_teacher_baseline: "non_teacher_mean"
      std_source: "non_teacher"

  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: "strict"
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: "additive"

# ============================================================================
# Model Configuration - Qwen/Qwen2.5-3B-Instruct
# ============================================================================
actor_rollout_ref:
  model:
    path: /data/code/exp/models/Qwen/Qwen2.5-3B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1e-6
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    # ⭐ CHORD 原论文不使用 KL loss（只使用 SFT loss + GRPO loss）
    use_kl_loss: false
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean

    # ⭐ Off-policy Policy Shaping Configuration (Self-generated Experience)
    off_policy_shaping_mode: "exgrpo_policy_shaping"
    off_policy_shaping_beta: 0.1

    # ============================================================================
    # ⭐ CHORD Configuration
    # ============================================================================
    use_chord: true

    # ============================================================================
    # μ 三阶段调度配置（基于 CHORD 原作者实现）
    # ============================================================================
    chord_mu_warmup_steps: 0
    chord_mu_decay_steps: 50
    chord_mu_peak: 0.5
    chord_mu_valley: 0.02

    # ============================================================================
    # φ(d) Token-wise 加权配置
    # ============================================================================
    chord_delta: 0.1
    chord_use_token_weighting: true

    # ⭐ CHORD 模式下，禁用 LUFFY 的 policy shaping（CHORD 使用 SFT loss）
    teacher_policy_shaping_enable: false
    teacher_use_log_prob: false
    teacher_use_clip: false

    use_dapo: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    use_qwen3: false
    enable_request_id: false
    prompt_length: 25068
    response_length: 512
    max_model_len: 25580
    temperature: 0.9
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: vllm
    mode: async
    gpu_memory_utilization: 0.5
    n: 8
    log_prob_max_token_len_per_gpu: 25580
    val_kwargs:
      n: 1
    max_env_worker: 32
    context_template: "linear"
    context_template_train_sp_action: false
    max_env_len: 4096
    sliding_window_size: 3
    sparse: true
    # SciWorld success threshold (raw score scale 0-100).
    # 0 = EPO-style (done AND score > 0); 70 = agl-envs strict (done AND score > 70).
    sciworld_success_threshold: 70
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 50
      tool_config_path: ""
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 25580

critic:
  ppo_max_token_len_per_gpu: 25580
  forward_max_token_len_per_gpu: 25580

# ============================================================================
# Data Configuration
# ============================================================================
data:
  train_batch_size: 8
  max_prompt_length: 1500
  max_response_length: 24080
  filter_overlong_prompts: true
  truncation: "error"
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: "val"
  max_train_tasks: 2400
  shuffle: true
  seed: 2026

# ============================================================================
# Environment Service Configuration - SciWorld
# ============================================================================
env_service:
  env_type: "sciworld"
  env_url: "http://127.0.0.1:8084"

# ============================================================================
# Task Manager Configuration
# ============================================================================
task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/sciworld.json

# ============================================================================
# Experience Manager Configuration
# ============================================================================
exp_manager:
  train_rollout_mode: "woexp"
  val_rollout_mode: "woexp"
  rollout_ratio: 0
  train_sample_mode: "alldiscard"
  train_sample_keepratio: 0.0
  experience_template: "\n\nSome Related Experience to help you to complete the task:<EXP>{}</EXP>\n\n"

  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  reme:
    base_url: "http://127.0.0.1:8124"
    workspace_id: "sciworld_3b_grpo_chord"
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0

  # Self-Generated Experience Replay Configuration (DISABLED)
  experience_replay:
    enable: false
    replay_start_ratio: 0.1
    exp_ratio: 0.0
    offpolicy_trajectories_per_task: 1
    experience_lbound: 2
    experience_rbound: 8
    exp_select_mode: "argmin"
    use_current_policy_entropy: true
    exp_is_correct: true
    max_trajectories_per_task: 5

  # Teacher/Expert Experience Replay Configuration (ENABLED for CHORD)
  teacher_experience:
    enable: true
    mix_mode: "rollout_level"
    data_path: "data/teacher_trajectories/sciworld_gold_qwen72b_filtered_0309.pkl"
    n_teacher_rollouts_per_task: 1
    max_trajectories_per_task: 6
    select_mode: "random"
    use_log_prob: false
    policy_shaping:
      enable: false
      mode: "p_div_p_beta"
      beta: 0.1
    adaptive_weight:
      enable: false

# ============================================================================
# Attribution-Driven Credit Assignment (ADCA-GRPO) Configuration
# ============================================================================
attribution_driven_credit_assignment:
  enable: false

# ============================================================================
# Thread Pool Configuration
# ============================================================================
thread_pool:
  max_workers: 8


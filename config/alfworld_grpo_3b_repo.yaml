hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

# ============================================================================
# AlfWorld GRPO Training Configuration with RePO (Replay-Enhanced Policy Optimization)
# ============================================================================
# This configuration implements the RePO algorithm from the paper:
# "RePO: Replay-Enhanced Policy Optimization for Efficient Data Reuse"
#
# Key differences from ExGRPO:
# 1. Stores ALL on-policy trajectories (not just successful ones)
# 2. Uses diverse replay strategies (full_scope, recency, reward, variance)
# 3. Epoch-based replay control (not training_progress based)
# 4. Supports G_off trajectories per task (default 8, vs ExGRPO's 1)
# 5. Separate advantage baseline for on/off-policy samples
# 6. Importance ratio clipping for off-policy data
# ============================================================================

trainer:
  experiment_name: alfworld_3b_grpo_repo_bz8_goff8
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 3  # ⭐ RePO uses epoch-based control, need multiple epochs
  save_freq: 100
  test_freq: 50
  val_before_train: false
  validation_data_dir: "experiments/alfworld/${trainer.experiment_name}/validation_log"
  rollout_data_dir: "experiments/alfworld/${trainer.experiment_name}/rollout_log"
  logger: ["console", "wandb"]

# ============================================================================
# Algorithm Configuration
# ============================================================================
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  
  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: "strict"
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: "additive"

# ============================================================================
# Model Configuration - Qwen/Qwen2.5-3B-Instruct
# ============================================================================
actor_rollout_ref:
  model:
    path: /data/code/exp/models/Qwen/Qwen2.5-3B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1e-6
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    # ⭐ RePO uses importance ratio clipping, not ExGRPO policy shaping
    off_policy_shaping_mode: "higher_clip_bound"
    off_policy_shaping_beta: 0.1
    use_dapo: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    use_qwen3: false
    enable_request_id: false
    prompt_length: 20480
    response_length: 2048
    max_model_len: 25580
    temperature: 0.9
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: vllm
    mode: async
    gpu_memory_utilization: 0.5
    n: 8  # ⭐ G_on = 8 on-policy rollouts per task
    log_prob_max_token_len_per_gpu: 25580
    val_kwargs:
      n: 1
    max_env_worker: 32
    context_template: "linear"
    context_template_train_sp_action: false
    max_env_len: 4096
    sparse: true
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 30
      tool_config_path: ""
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 25580

critic:
  ppo_max_token_len_per_gpu: 25580
  forward_max_token_len_per_gpu: 25580

# ============================================================================
# Data Configuration
# ============================================================================
data:
  train_batch_size: 8
  max_prompt_length: 4000
  max_response_length: 21580
  filter_overlong_prompts: true
  truncation: "error"
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: "val"
  max_train_tasks: 800
  shuffle: true

# ============================================================================
# Environment Service Configuration - AlfWorld
# ============================================================================
env_service:
  env_type: "alfworld"
  env_url: "http://127.0.0.1:8081"

# ============================================================================
# Task Manager Configuration
# ============================================================================
task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/alfworld.json

# ============================================================================
# Experience Manager Configuration
# ============================================================================
exp_manager:
  # ============================================================================
  # Experience-Guided Rollout Configuration (DISABLED)
  # ============================================================================
  train_rollout_mode: "woexp"
  val_rollout_mode: "woexp"
  rollout_ratio: 0
  train_sample_mode: "alldiscard"
  train_sample_keepratio: 0.0
  experience_template: "\n\nSome Related Experience to help you to complete the task:<EXP>{}</EXP>\n\n"
  
  # ============================================================================
  # Experience Summarization Configuration (DISABLED)
  # ============================================================================
  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  
  reme:
    base_url: "http://127.0.0.1:8124"
    workspace_id: "alfworld_3b_grpo_repo"
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0
  
  # ============================================================================
  # ExGRPO Experience Replay Configuration (DISABLED - using RePO instead)
  # ============================================================================
  experience_replay:
    enable: false  # ⭐ Disabled - using RePO instead
    replay_start_ratio: 0.1
    exp_ratio: 0.5
    offpolicy_trajectories_per_task: 1
    experience_lbound: 2
    experience_rbound: 8
    exp_select_mode: "argmin"
    use_current_policy_entropy: true
    exp_is_correct: true
    max_trajectories_per_task: 5
  
  # ============================================================================
  # Teacher Experience Configuration (DISABLED)
  # ============================================================================
  teacher_experience:
    enable: false
  
  # ============================================================================
  # ⭐ RePO (Replay-Enhanced Policy Optimization) Configuration
  # ============================================================================
  # Reference: RePO Paper - "RePO: Replay-Enhanced Policy Optimization"
  # 
  # Key features:
  # 1. Stores ALL on-policy trajectories (not just successful ones)
  # 2. Epoch-based replay control (replay_start_epoch)
  # 3. Diverse replay strategies (full_scope, recency, reward, variance)
  # 4. G_off trajectories per task (default 8)
  # 5. Separate advantage baseline for on/off-policy
  # 6. Importance ratio clipping for off-policy
  # ============================================================================
  repo:
    # ⭐ Main switch: Enable RePO
    enable: true
    
    # ============================================================================
    # Epoch-based Replay Control
    # ============================================================================
    # Start replay from this epoch (0-indexed)
    # - 0: Start replay from first epoch (similar to ExGRPO)
    # - 1: Start replay from second epoch (RePO paper default)
    # 
    # Design rationale:
    # - First epoch: Let policy learn basic capabilities, store trajectories
    # - Subsequent epochs: Use replay to improve data efficiency
    replay_start_epoch: 1
    
    # ============================================================================
    # Replay Strategy Configuration (4 strategies from RePO paper)
    # ============================================================================
    # Strategy for selecting trajectories from replay buffer
    # 
    # Options (from RePO paper Section 3.3):
    # - "full_scope": Use all historical samples (most thorough, but may have large distribution shift)
    # - "recency": Use most recent K samples (smaller distribution shift, DEFAULT recommended)
    # - "reward": Use samples with highest rewards (reinforces known good behaviors)
    # - "variance": Select samples that maximize reward variance (mitigates vanishing gradient)
    replay_strategy: "recency"
    
    # ============================================================================
    # Sample Counts Configuration (G_on and G_off)
    # ============================================================================
    # RePO paper default: G_on = 8, G_off = 8
    # Ablation experiments: G_off in {0, 4, 8, 12, 16}
    
    # Number of on-policy samples per task (G_on)
    g_on: 8
    
    # Number of off-policy samples per task (G_off)
    # - Paper default: 8
    # - Set to 0 to disable replay (pure on-policy)
    g_off: 8
    
    # ============================================================================
    # Replay Buffer Configuration
    # ============================================================================
    # Maximum trajectories to store per task
    # - Should be >= g_off to have enough samples for replay
    max_trajectories_per_task: 32
    
    # Buffer update mode when capacity is exceeded
    # - "fifo": First-in-first-out (remove oldest)
    # - "reward_priority": Remove lowest reward trajectories
    buffer_update_mode: "fifo"
    
    # ⭐ RePO specific: Store ALL trajectories (not just successful ones)
    # - ExGRPO: Only stores reward > threshold trajectories
    # - RePO: Stores all trajectories, uses strategy to select
    store_all_trajectories: true
    
    # ============================================================================
    # Advantage Estimation Configuration
    # ============================================================================
    # Advantage computation mode
    # - "separate": RePO style, on/off use different baselines (recommended)
    #   * On-policy:  A = (R - mean(R_on)) / std(R_on)
    #   * Off-policy: A = (R - mean(R_all)) / std(R_all)
    # - "unified": ExGRPO style, all samples use same baseline
    #   * All: A = (R - mean(R_all)) / std(R_all)
    advantage_mode: "separate"
    
    # Whether to normalize advantage by std
    # - true: A = (R - mean) / std (standard GRPO)
    # - false: A = R - mean (Dr.GRPO style)
    norm_adv_by_std: true
    
    # ============================================================================
    # Importance Sampling Configuration
    # ============================================================================
    # PPO-style clip epsilon for importance ratio
    # - Used to limit off-policy update magnitude
    # - Old samples with low probability under current policy will be downweighted
    clip_eps: 0.2
    
    # Whether to use importance ratio clipping
    use_importance_clipping: true

# ============================================================================
# Attribution-Driven Credit Assignment (ADCA-GRPO) Configuration
# ============================================================================
attribution_driven_credit_assignment:
  enable: false
  evaluation_type: "api"
  consistent_scale: 1.0
  pos_unconsistent_scale: 0.2
  neg_unconsistent_scale: -0.2
  concurrent: 5
  model: "qwen-plus"
  api_max_retries: 200
  llm_evaluation_log_dir: null
  adca_grpo:
    prm_scheme: "decouple"
    do_batch_norm: true
    equal_trajectory_weight: true
    fix_base: 0.2
    alpha_cosine_decay_enable: false
    alpha: 0.1
    alpha_min: 0.0
    total_steps: 100
    orm_distribution: last_step
    enable_length_normalization: false
    prm_steps: 100
    skip_type: "none"
    enable_adca_metric: false

# ============================================================================
# Thread Pool Configuration
# ============================================================================
thread_pool:
  max_workers: 8

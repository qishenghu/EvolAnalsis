hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

# ============================================================================
# SciWorld GRPO Training Configuration with Teacher Experience Replay (LUFFY)
# ============================================================================
# This configuration is for training Qwen/Qwen2.5-3B-Instruct on SciWorld
# using GRPO with Teacher Experience Replay mechanism (LUFFY-style).
#
# Key settings:
# - batch_size: 8
# - rollout: 8 (n_rollout)
# - mix_mode: rollout_level
# - n_teacher_rollouts_per_task: 1  (7 on-policy + 1 teacher per task)
# - use_log_prob: false
# - select_mode: random
#
# Teacher data:
# - data/teacher_trajectories/sciworld_gold_qwen72b_filtered.pkl
# ============================================================================

trainer:
  experiment_name: sciworld_3b_grpo_teacher72b_only_bz8_mix1_no_logprob_random
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 1
  save_freq: 100
  test_freq: 50
  val_before_train: false
  validation_data_dir: "experiments/sciworld/${trainer.experiment_name}/validation_log"
  rollout_data_dir: "experiments/sciworld/${trainer.experiment_name}/rollout_log"
  logger: ["console", "wandb"]

# ============================================================================
# Algorithm Configuration
# ============================================================================
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: "strict"
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: "additive"

# ============================================================================
# Model Configuration - Qwen/Qwen2.5-3B-Instruct
# ============================================================================
actor_rollout_ref:
  model:
    path: /data/code/exp/models/Qwen/Qwen2.5-3B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1e-6
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    # ⭐ Off-policy Policy Shaping Configuration (Self-generated Experience)
    # For self-generated experience, recommend using "exgrpo_policy_shaping"
    off_policy_shaping_mode: "exgrpo_policy_shaping"
    off_policy_shaping_beta: 0.1

    # ⭐ Teacher Experience Loss Configuration (LUFFY)
    teacher_use_log_prob: ${exp_manager.teacher_experience.use_log_prob}
    teacher_policy_shaping_enable: ${exp_manager.teacher_experience.policy_shaping.enable}
    teacher_policy_shaping_mode: ${exp_manager.teacher_experience.policy_shaping.mode}
    teacher_policy_shaping_beta: ${exp_manager.teacher_experience.policy_shaping.beta}
    teacher_use_clip: false

    # ⭐ Gradient-direction diagnostics (teacher vs on-policy)
    teacher_grad_dir_diag_enable: true
    teacher_grad_dir_diag_interval: 1
    teacher_grad_dir_diag_max_param_numel: 200000
    teacher_grad_dir_diag_max_params: 4
    teacher_grad_dir_diag_param_name_excludes: ["lm_head", "embed", "wte", "word_embeddings", "tok_embeddings", "token_embeddings", "shared"]
    teacher_grad_dir_diag_param_name_contains_ln: ["norm", "ln", "layernorm"]
    teacher_grad_dir_diag_param_name_contains_proj: ["q_proj.bias", "k_proj.bias", "v_proj.bias"]
    teacher_grad_dir_diag_layer_filter_mode_proj: "last_k"
    teacher_grad_dir_diag_last_k_proj: 2
    teacher_grad_dir_diag_layer_filter_mode_ln: "all"

    use_dapo: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      use_orig_params: false
  rollout:
    use_qwen3: false
    enable_request_id: false
    prompt_length: 20480
    response_length: 2048
    max_model_len: 25580
    temperature: 0.9
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: vllm
    mode: async
    gpu_memory_utilization: 0.5
    n: 8
    log_prob_max_token_len_per_gpu: 25580
    val_kwargs:
      n: 1
    max_env_worker: 32
    context_template: "linear"
    context_template_train_sp_action: false
    max_env_len: 4096
    sparse: true
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 50
      tool_config_path: ""
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 25580

critic:
  ppo_max_token_len_per_gpu: 25580
  forward_max_token_len_per_gpu: 25580

# ============================================================================
# Data Configuration
# ============================================================================
data:
  train_batch_size: 8
  max_prompt_length: 4000
  max_response_length: 21580
  filter_overlong_prompts: true
  truncation: "error"
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: "val"
  max_train_tasks: 800
  shuffle: true
  seed: 2026

# ============================================================================
# Environment Service Configuration - SciWorld
# ============================================================================
env_service:
  env_type: "sciworld"
  env_url: "http://127.0.0.1:8084"

# ============================================================================
# Task Manager Configuration
# ============================================================================
task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/sciworld.json

# ============================================================================
# Experience Manager Configuration
# ============================================================================
exp_manager:
  # Experience-Guided Rollout Configuration (DISABLED)
  train_rollout_mode: "woexp"
  val_rollout_mode: "woexp"
  rollout_ratio: 0
  train_sample_mode: "alldiscard"
  train_sample_keepratio: 0.0
  experience_template: "\n\nSome Related Experience to help you to complete the task:<EXP>{}</EXP>\n\n"

  # Experience Summarization Configuration (DISABLED)
  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  reme:
    base_url: "http://127.0.0.1:8124"
    workspace_id: "sciworld_3b_grpo_teacher_only"
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0

  # Self-Generated Experience Replay Configuration (DISABLED)
  experience_replay:
    enable: false
    replay_start_ratio: 0.1
    exp_ratio: 0.0
    offpolicy_trajectories_per_task: 1
    experience_lbound: 2
    experience_rbound: 8
    exp_select_mode: "argmin"
    use_current_policy_entropy: true
    exp_is_correct: true
    max_trajectories_per_task: 5

  # Teacher Experience Replay Configuration (ENABLED - LUFFY Style)
  teacher_experience:
    enable: true
    mix_mode: "rollout_level"
    data_path: "data/teacher_trajectories/sciworld_gold_qwen72b_filtered.pkl"
    n_teacher_rollouts_per_task: 1
    max_trajectories_per_task: 6
    select_mode: "random"
    use_log_prob: false
    policy_shaping:
      enable: true
      mode: "p_div_p_beta"
      beta: 0.1

# ============================================================================
# Attribution-Driven Credit Assignment (ADCA-GRPO) Configuration
# ============================================================================
attribution_driven_credit_assignment:
  enable: false

# ============================================================================
# Thread Pool Configuration
# ============================================================================
thread_pool:
  max_workers: 8


hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

# ============================================================================
# WebShop GRPO Training Configuration (7B)
# ============================================================================
# This configuration mirrors `config/webshop_grpo_3b.yaml` but switches the
# base model to Qwen2.5-7B-Instruct.
#
# Assumptions:
# - AgentGym WebShop server is running at 127.0.0.1:36003
# - EnvService for WebShop is running at 127.0.0.1:8083
# - train split = 6710 task ids from `webshop_train.json`
# - val/dev/test split = 200 task ids from `webshop_test.json`
# ============================================================================

trainer:
  experiment_name: webshop_7b_grpo_bz8_1600
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 1
  save_freq: 100
  test_freq: 50
  val_before_train: false
  validation_data_dir: "experiments/webshop/${trainer.experiment_name}/validation_log"
  rollout_data_dir: "experiments/webshop/${trainer.experiment_name}/rollout_log"
  logger: ["console", "wandb"]

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: "strict"
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: "additive"

actor_rollout_ref:
  model:
    path: /data/code/exp/models/Qwen/Qwen2.5-7B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1e-6
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    off_policy_shaping_mode: "exgrpo_policy_shaping"
    off_policy_shaping_beta: 0.1
    use_dapo: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    use_qwen3: false
    enable_request_id: false
    prompt_length: 25068
    response_length: 512
    max_model_len: 25580
    temperature: 0.6
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: vllm
    mode: async
    gpu_memory_utilization: 0.5
    n: 8
    stop_sequences: ["</action>"]
    log_prob_max_token_len_per_gpu: 25580
    val_kwargs:
      n: 1
      stop_sequences: ["</action>"]
    max_env_worker: 32
    context_template: "linear"
    context_template_train_sp_action: false
    max_env_len: 4096
    sliding_window_size: 3  # keep last 5 LLM turns full, compress older ones to action-only
    sparse: true
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 30
      tool_config_path: ""
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 25580

critic:
  ppo_max_token_len_per_gpu: 25580
  forward_max_token_len_per_gpu: 25580

data:
  train_batch_size: 8
  max_prompt_length: 1500
  max_response_length: 24080
  filter_overlong_prompts: true
  truncation: "error"
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: "val"
  max_train_tasks: 1600
  shuffle: true
  seed: 2026

env_service:
  env_type: "webshop"
  env_url: "http://127.0.0.1:8083"
  env_params:
    action_format: "react_tags"
    enable_action_sanitizer: true
    invalid_action_penalty: -0.1
    max_consecutive_invalid_actions: 2

task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/webshop.json

exp_manager:
  train_rollout_mode: "woexp"
  val_rollout_mode: "woexp"
  rollout_ratio: 0
  train_sample_mode: "alldiscard"
  train_sample_keepratio: 0.0
  experience_template: "\n\nSome Related Experience to help you to complete the task:<EXP>{}</EXP>\n\n"
  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  reme:
    base_url: "http://127.0.0.1:8124"
    workspace_id: "webshop_7b_grpo"
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0
  experience_replay:
    enable: false
    replay_start_ratio: 1.0
    exp_ratio: 0.0
    offpolicy_trajectories_per_task: 1
    experience_lbound: 2
    experience_rbound: 8
    exp_select_mode: "argmin"
    use_current_policy_entropy: true
    exp_is_correct: true
    max_trajectories_per_task: 5

attribution_driven_credit_assignment:
  enable: false
  evaluation_type: "api"
  consistent_scale: 1.0
  pos_unconsistent_scale: 0.2
  neg_unconsistent_scale: -0.2
  concurrent: 5
  model: "qwen-plus"
  api_max_retries: 200
  llm_evaluation_log_dir: null
  adca_grpo:
    prm_scheme: "decouple"
    do_batch_norm: true
    equal_trajectory_weight: true
    fix_base: 0.2
    alpha_cosine_decay_enable: false
    alpha: 0.1
    alpha_min: 0.0
    total_steps: 100
    orm_distribution: last_step
    enable_length_normalization: false
    prm_steps: 100
    skip_type: "none"
    enable_adca_metric: false

thread_pool:
  max_workers: 8

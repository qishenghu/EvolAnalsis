# ============================================================================
# 7.4-A only (advantage-aware teacher token gate) ablation
# - 7.1 OFF
# - 7.2 OFF
# - 7.4 ON
# ============================================================================

defaults:
  - base

trainer:
  experiment_name: alfworld_3b_grpo_teacher72b_only_no_logprob__adv_gate_only_v1

actor_rollout_ref:
  actor:
    teacher_use_log_prob: ${exp_manager.teacher_experience.use_log_prob}
    teacher_policy_shaping_enable: ${exp_manager.teacher_experience.policy_shaping.enable}
    teacher_policy_shaping_mode: ${exp_manager.teacher_experience.policy_shaping.mode}
    teacher_policy_shaping_beta: ${exp_manager.teacher_experience.policy_shaping.beta}
    teacher_use_clip: false

    # 7.3 OFF
    teacher_token_gate_enable: false

    # 7.4-A ON
    teacher_adv_gate_enable: ${exp_manager.teacher_experience.adv_gate.enable}
    teacher_adv_gate_mode: ${exp_manager.teacher_experience.adv_gate.mode}
    teacher_adv_gate_threshold: ${exp_manager.teacher_experience.adv_gate.threshold}
    teacher_adv_gate_temperature: ${exp_manager.teacher_experience.adv_gate.temperature}
    teacher_adv_gate_min: ${exp_manager.teacher_experience.adv_gate.min}
    teacher_adv_gate_max: ${exp_manager.teacher_experience.adv_gate.max}
    teacher_adv_gate_stop_grad: ${exp_manager.teacher_experience.adv_gate.stop_grad}

algorithm:
  grpo:
    teacher_baseline_separation:
      enable: false

exp_manager:
  teacher_experience:
    enable: true
    adaptive_weight:
      enable: false

    adv_gate:
      enable: true
      mode: adv_sigmoid
      threshold: 0.0
      temperature: 1.0
      min: 0.0
      max: 1.0
      stop_grad: true


actor_rollout_ref:
  actor:
    clip_ratio_high: 0.28
    entropy_coeff: 0
    fsdp_config:
      optimizer_offload: true
      param_offload: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    loss_agg_mode: token-mean
    off_cliprange_high: 0.6
    off_policy_shaping_beta: 0.1
    off_policy_shaping_mode: exgrpo_policy_shaping
    optim:
      lr: 1e-6
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    use_dapo: false
    use_kl_loss: true
  model:
    enable_gradient_checkpointing: true
    path: /data/code/exp/models/Qwen/Qwen2.5-3B-Instruct
    use_remove_padding: true
  ref:
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 25580
    log_prob_micro_batch_size_per_gpu: 1
  rollout:
    context_template: linear
    context_template_train_sp_action: false
    enable_request_id: false
    gpu_memory_utilization: 0.5
    log_prob_max_token_len_per_gpu: 25580
    log_prob_micro_batch_size_per_gpu: 1
    max_env_len: 4096
    max_env_worker: 32
    max_model_len: 25580
    mode: async
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 30
      tool_config_path: ''
    n: 8
    name: vllm
    prompt_length: 20480
    response_length: 2048
    sparse: true
    stop_sequences:
    - </action>
    temperature: 0.9
    tensor_model_parallel_size: 1
    use_qwen3: false
    val_kwargs:
      n: 1
      stop_sequences:
      - </action>
algorithm:
  adv_estimator: grpo
  dapo:
    dynamic_sampling:
      enable: false
      filter_mode: strict
    enable: false
    overlong_reward_shaping:
      enable: false
      soft_penalty_mode: additive
      truncation_penalty: -0.5
  use_kl_in_reward: false
attribution_driven_credit_assignment:
  adca_grpo:
    alpha: 0.1
    alpha_cosine_decay_enable: false
    alpha_min: 0.0
    do_batch_norm: true
    enable_adca_metric: false
    enable_length_normalization: false
    equal_trajectory_weight: true
    fix_base: 0.2
    orm_distribution: last_step
    prm_scheme: decouple
    prm_steps: 100
    skip_type: none
    total_steps: 100
  api_max_retries: 200
  concurrent: 5
  consistent_scale: 1.0
  enable: false
  evaluation_type: api
  llm_evaluation_log_dir: null
  model: qwen-plus
  neg_unconsistent_scale: -0.2
  pos_unconsistent_scale: 0.2
critic:
  forward_max_token_len_per_gpu: 25580
  ppo_max_token_len_per_gpu: 25580
data:
  filter_overlong_prompts: true
  max_prompt_length: 4000
  max_response_length: 21580
  max_train_tasks: 800
  return_raw_chat: true
  seed: 2026
  shuffle: true
  train_batch_size: 8
  train_files: null
  truncation: error
  val_batch_size: 8
  val_files: null
  val_type: val
defaults:
- ppo_trainer
- agentevolver
- _self_
env_service:
  env_params:
    action_format: react_tags
  env_type: alfworld
  env_url: http://127.0.0.1:8081
exp_manager:
  experience_replay:
    enable: false
    exp_is_correct: true
    exp_ratio: 0.0
    exp_select_mode: argmin
    experience_lbound: 2
    experience_rbound: 8
    max_trajectories_per_task: 5
    offpolicy_trajectories_per_task: 1
    replay_start_ratio: 1.0
    use_current_policy_entropy: true
  experience_template: '


    Some Related Experience to help you to complete the task:<EXP>{}</EXP>


    '
  init_exp_before_training: false
  init_exp_only: false
  reme:
    base_url: http://127.0.0.1:8124
    enable_context_generator: false
    enable_summarizer: false
    retrieve_top_k: 3
    updated_freq: 0
    workspace_id: alfworld_3b_grpo
  rollout_ratio: 0
  summary_batch_size: 8
  train_rollout_mode: woexp
  train_sample_keepratio: 0.0
  train_sample_mode: alldiscard
  val_rollout_mode: woexp
hydra:
  searchpath:
  - file://external/config_fallback
  - file://config
task_manager:
  bs: ${data.train_batch_size}
  env_profile: cookbook/env_profiles/alfworld.json
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  llm_client: qwen-plus
  mixture:
    shuffle: true
    synthetic_data_ratio: 0.0
    use_original_tasks: true
  n: 0
  num_explore_threads: ${thread_pool.max_workers}
  strategy: random
  strategy_args:
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_k: 100
    exploration_llm_top_p: 1.0
    max_explore_step: 30
    max_llm_retries: 6
  train_data_path: null
  val_data_path: null
thread_pool:
  max_workers: 8
trainer:
  experiment_name: alfworld_3b_grpo_react_tags
  logger:
  - console
  - wandb
  n_gpus_per_node: 4
  nnodes: 1
  project_name: agentevolver
  rollout_data_dir: experiments/alfworld/alfworld_3b_grpo_react_tags/rollout_log
  save_freq: 100
  test_freq: 50
  total_epochs: 1
  val_before_train: false
  validation_data_dir: experiments/alfworld/alfworld_3b_grpo_react_tags/validation_log

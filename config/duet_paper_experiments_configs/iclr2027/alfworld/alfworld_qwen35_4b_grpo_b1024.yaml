# ============================================================================
# ICLR2027 baseline: Qwen3.5-4B (hybrid thinking) PURE GRPO on ALFWorld.
# Lane A (GPUs 0-3). Rollout via EXTERNAL vLLM servers (env 'vllm2'),
# training in env 'duet2' (transformers 5.5.1, vendored verl 0.4, no vllm).
#
# Length regime (recon R4, verified):
#   max_model_len 32768 = prompt_length 28672 + response_length 4096
#   data.max_prompt_length 4096 == max_seq_length (= max_model_len - data.max_response_length)
#   all *_max_token_len_per_gpu = 32768
# Validate with: python config/validate_length_config.py <this file>
#
# Port scheme: external rollout servers lane A = 127.0.0.1:8201-8204 (one per
# GPU 0-3), lane B = 8211-8214 (GPUs 4-7). Ports 82xx are BELOW the ephemeral
# range (32768-60999), so they never collide with random vLLM/Ray ports and
# are safe as client targets. Env services keep their usual ports (alfworld
# 8081, webshop 8083, sciworld 8084).
# ============================================================================
hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

trainer:
  experiment_name: alfworld_qwen35_4b_grpo_ctx
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 1
  total_training_steps: 100
  save_freq: 50
  test_freq: 50
  val_before_train: false
  validation_data_dir: experiments/alfworld/${trainer.experiment_name}/validation_log
  rollout_data_dir: experiments/alfworld/${trainer.experiment_name}/rollout_log
  logger:
  - console
  - wandb
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  grpo:
    teacher_baseline_separation:
      enable: false
      teacher_baseline: all_mean
      non_teacher_baseline: non_teacher_mean
      std_source: non_teacher
  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: strict
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: additive
actor_rollout_ref:
  model:
    path: /data/shared_models/Qwen3.5-4B-thinkraw
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1.0e-06
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    ppo_max_token_len_per_gpu: 12288
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0.005   # reasoning students collapse to short deterministic actions without it (entropy 0.34->0.09 by step 20)
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    use_dr3: false
    use_chord: false
    use_uniform_mix: false
    teacher_use_log_prob: false
    teacher_policy_shaping_enable: false
    teacher_use_clip: false
    use_dapo: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    use_qwen3: true
    # Qwen3.5 is a native-thinking model; cmt_base currently accepts
    # {none, prompt_guided, native_qwen3} and native_qwen3 is the hybrid
    # thinking path. Switch here if ctx-surgery adds a dedicated qwen3.5 mode.
    thinking_mode: native_qwen35
    # Thinking models: drop <think> blocks from earlier turns when rebuilding
    # the multi-turn context (Qwen3.5 chat-template convention).
    # keep the last N assistant turns and observations in full; older observations
    # drop their action-hint block (measured -62.8% tokens, SC hashes 1173/1173 kept)
    sliding_window_size: 3
    reasoning_context_budget: 1024
    enable_request_id: false
    prompt_length: 22528
    response_length: 10240
    max_model_len: 32768
    temperature: 0.9
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    # External rollout servers (env 'vllm2', vllm 0.20.2), one per GPU.
    # gpu_memory_utilization below only matters for the colocated fallback;
    # the external servers take their own flag at launch.
    name: external_vllm
    external_server_addresses:
    - 127.0.0.1:8201
    - 127.0.0.1:8202
    - 127.0.0.1:8203
    - 127.0.0.1:8204
    mode: async
    gpu_memory_utilization: 0.55
    n: 8
    log_prob_max_token_len_per_gpu: 12288
    # NOTE: no stop_sequences — thinking models must NOT stop on '</action>'
    # (the tag legitimately appears inside <think> spans).
    val_kwargs:
      n: 1
    max_env_worker: 32
    context_template: linear
    context_template_train_sp_action: false
    max_env_len: 2048
    sparse: true
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 30
      tool_config_path: ''
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 12288
critic:
  ppo_max_token_len_per_gpu: 12288
  forward_max_token_len_per_gpu: 12288
data:
  train_batch_size: 8
  max_prompt_length: 4096
  max_response_length: 8192
  filter_overlong_prompts: true
  truncation: error
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: val
  max_train_tasks: 800
  shuffle: true
  # Run seed and curriculum seed are decoupled (ICLR2027 protocol §2.4):
  # task_seed pins the task draw so replicates share one curriculum.
  seed: 2025
  task_seed: 2026
env_service:
  env_type: alfworld
  env_url: http://127.0.0.1:8081
  env_params:
    action_format: react_tags
task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/alfworld.json
exp_manager:
  train_rollout_mode: woexp
  val_rollout_mode: woexp
  rollout_ratio: 0
  train_sample_mode: alldiscard
  train_sample_keepratio: 0.0
  experience_template: '


    Some Related Experience to help you to complete the task:<EXP>{}</EXP>


    '
  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  reme:
    base_url: http://127.0.0.1:8124
    workspace_id: alfworld_qwen35_4b_grpo
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0
  experience_replay:
    enable: false
  # PURE GRPO: no teacher mixing, no state channel.
  teacher_experience:
    enable: false
  state_channel:
    enable: false
attribution_driven_credit_assignment:
  enable: false
thread_pool:
  max_workers: 8

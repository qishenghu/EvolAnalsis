# Qwen3.5-4B ALFWorld causal context gate (lane A, GPUs 0-3).
#
# Unlike the failed B1024 prototype, this run never rebuilds an episode into a
# post-hoc training transcript.  Each trajectory contributes one token-weighted
# decision snapshot: exact rollout prompt IDs + exact sampled IDs/logprobs, while
# the GRPO reward/advantage remains trajectory-level.
hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

trainer:
  experiment_name: alfworld_qwen35_4b_grpo_snapshot_32k_gate_v3
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 1
  total_training_steps: 2
  save_freq: 1000
  test_freq: 1000
  val_before_train: false
  validation_data_dir: experiments/alfworld/${trainer.experiment_name}/validation_log
  rollout_data_dir: experiments/alfworld/${trainer.experiment_name}/rollout_log
  logger: [console]

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  grpo:
    teacher_baseline_separation:
      enable: false
      teacher_baseline: all_mean
      non_teacher_baseline: non_teacher_mean
      std_source: non_teacher
  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: strict
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: additive

actor_rollout_ref:
  model:
    path: /data/shared_models/Qwen3.5-4B-think
    # Qwen3.5's hybrid Gated DeltaNet cannot use verl's rmpad/Ulysses patch.
    use_remove_padding: false
    enable_gradient_checkpointing: true
  actor:
    behavior_logprob_fp32_temperature: true
    skip_zero_advantage_grpo_update: true
    optim:
      lr: 1.0e-06
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 2
    ppo_max_token_len_per_gpu: 32768
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    use_dr3: false
    use_chord: false
    use_uniform_mix: false
    teacher_use_log_prob: false
    teacher_policy_shaping_enable: false
    teacher_use_clip: false
    use_dapo: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    use_qwen3: true
    thinking_mode: native_qwen35
    enable_request_id: false
    prompt_length: 22528
    response_length: 10240
    max_model_len: 32768
    length_truncation_reward: 0.0
    length_truncation_max_decision_fraction: 0.10
    temperature: 0.9
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: external_vllm
    external_server_addresses:
      - 127.0.0.1:8201
      - 127.0.0.1:8202
      - 127.0.0.1:8203
      - 127.0.0.1:8204
    external_request_timeout: 1200
    external_sleep_between_steps: true
    # Must match ENFORCE_EAGER=0 in the external-server manifest.
    enforce_eager: false
    use_rollout_log_probs_as_old: true
    # Calibrated Qwen3.5 BF16 backend-drift guard.  The sampled vLLM logprob,
    # rather than actor teacher-force recomputation, remains PPO's denominator.
    rollout_logprob_drift_mean_threshold: 0.02
    rollout_logprob_drift_p99_threshold: 0.25
    rollout_importance_ratio_outside_clip_threshold: 0.01
    rollout_logprob_drift_max_threshold: 0.75
    max_trajectory_resubmits: 1
    mode: async
    # Must match the separately launched external server contract.
    gpu_memory_utilization: 0.25
    n: 2
    log_prob_max_token_len_per_gpu: 32768
    val_kwargs:
      n: 1
    max_env_worker: 4
    context_template: linear
    context_template_train_sp_action: false
    max_env_len: 4096
    sparse: true
    context_management:
      enabled: true
      max_prompt_tokens: 22528
      recent_turns: 2
      min_recent_turns: 1
      # Old ALFWorld action lists are repetitive; retain the result text, while
      # the goal and current AVAILABLE ACTIONS remain protected and lossless.
      # Empirically, after removing repeated AVAILABLE ACTIONS, the longest of
      # the top-1000 historical observations is 132 tokens. 160 is therefore a
      # near-lossless cap without replaying stale legal-action menus.
      history_observation_max_tokens: 160
      recent_observation_max_tokens: -1
      allow_current_observation_truncation: false
      # The official Qwen3.5 template strips historical think blocks. Keep the
      # canonical action history; the current turn still has the full 10K cap.
      reasoning_history_tokens: 0
      snapshot_training: true
      snapshot_selection: token_weighted
      snapshot_selection_seed: 2025
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 3
      tool_config_path: ''
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 32768

critic:
  ppo_max_token_len_per_gpu: 32768
  forward_max_token_len_per_gpu: 32768

data:
  train_batch_size: 2
  max_prompt_length: 22528
  max_response_length: 10240
  filter_overlong_prompts: true
  truncation: error
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: val
  max_train_tasks: 800
  shuffle: true
  seed: 2025
  task_seed: 2026

env_service:
  env_type: alfworld
  env_url: http://127.0.0.1:8081
  env_params:
    action_format: react_tags

task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 3
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/alfworld.json

exp_manager:
  train_rollout_mode: woexp
  val_rollout_mode: woexp
  rollout_ratio: 0
  train_sample_mode: alldiscard
  train_sample_keepratio: 0.0
  experience_template: 'Some Related Experience: <EXP>{}</EXP>'
  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  reme:
    base_url: http://127.0.0.1:8124
    workspace_id: alfworld_qwen35_4b_snapshot_gate
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0
  experience_replay:
    enable: false
  teacher_experience:
    enable: false
  state_channel:
    enable: false

attribution_driven_credit_assignment:
  enable: false

thread_pool:
  max_workers: 4

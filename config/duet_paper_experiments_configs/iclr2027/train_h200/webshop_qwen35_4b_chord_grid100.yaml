# ============================================================================
# GRID CELL p0_chord_ws_s0: Qwen3.5-4B CHORD baseline on WebShop, 100 steps.
# Base: alfworld_qwen35_4b_grpo_grid100.yaml (production lineage: smoke ->
# throughput trials -> anchor). Only algorithm + teacher-data keys differ
# from the base; algorithm block audited from NeurIPS-era webshop_qwen3b_chord.yaml.
# CHORD = use_chord + manual mu 0.9->0.05/decay 25/warmup 0/no token
# weighting + use_kl_loss:false; chord_mu_adaptive deliberately absent.
# WS student contract keys (recent4/512, temp 0.6, trunc -0.1, sanitizer
# env_params, env :8083, webshop profile) ported from
# iclr2027/collect_h200/webshop_qwen35_4b_collect_h200.yaml.
# Teacher data: data/teacher_trajectories/iclr2027_flash/ (deepseek-v4-flash
# openrouter v2, one success per task; see .manifest.json beside the file).
# ============================================================================
hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

trainer:
  experiment_name: p0_chord_ws_s0
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 2
  total_training_steps: 100
  # Persist every half of the run. This key is explicit so launcher.py
  # resolves it into the workspace instead of a disposable Ray working_dir.
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  save_freq: 10
  test_freq: 10
  val_before_train: false
  resume_mode: auto
  # Preserve the exact pre-update state if a strict identity gate stops the run.
  save_checkpoint_on_identity_failure: true
  export_actor_weights_on_identity_failure: true
  validation_data_dir: experiments/webshop/${trainer.experiment_name}/validation_log
  rollout_data_dir: experiments/webshop/${trainer.experiment_name}/rollout_log
  # Future launches are required to stream online while retaining local logs.
  logger: [console, wandb]

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  grpo:
    # NeurIPS-era CHORD/LUFFY baselines all ran WITH baseline separation
    # (webshop_qwen3b_chord/luffy.yaml lines 29-33) — keep it for comparability.
    teacher_baseline_separation:
      enable: true
      teacher_baseline: all_mean
      non_teacher_baseline: non_teacher_mean
      std_source: non_teacher
  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: strict
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: additive

actor_rollout_ref:
  model:
    path: /projects_vol/gp_wangwy/models/Qwen3.5-4B
    # Qwen3.5 Gated DeltaNet cannot use verl's remove-padding/Ulysses patch.
    use_remove_padding: false
    enable_gradient_checkpointing: true
  actor:
    behavior_logprob_fp32_temperature: true
    # A pure-GRPO all-equal group has no policy-gradient signal. Do not allow
    # KL roundoff or AdamW decay to turn it into a weight-changing update.
    skip_zero_advantage_grpo_update: true
    optim:
      lr: 1.0e-06
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    ppo_max_token_len_per_gpu: 32768
    use_kl_loss: false
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    use_dr3: false
    use_chord: true
    use_uniform_mix: false
    teacher_use_log_prob: false
    teacher_policy_shaping_enable: false
    teacher_use_clip: false
    use_dapo: false
    chord_mu_warmup_steps: 0
    chord_mu_decay_steps: 25
    chord_mu_peak: 0.9
    chord_mu_valley: 0.05
    chord_use_token_weighting: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    use_qwen3: true
    thinking_mode: native_qwen35
    enable_request_id: false
    # One decision receives up to 10K sampled reasoning+action tokens; the
    # managed prompt receives the remainder of the exact 32K model budget.
    prompt_length: 22528
    response_length: 10240
    max_model_len: 32768
    # WS contract: hitting 10K means no valid action was produced — episode
    # ends, scored as failure with a small penalty.
    length_truncation_reward: -0.1
    length_truncation_max_decision_fraction: 0.10
    temperature: 0.6
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: external_vllm
    external_server_addresses:
      - 127.0.0.1:8201
      - 127.0.0.1:8202
      - 127.0.0.1:8203
      - 127.0.0.1:8204
    external_request_timeout: 1200
    external_sleep_between_steps: true
    # Must match MAX_NUM_SEQS=1 in the external-server manifest.
    max_num_seqs: 16
    enforce_eager: false
    # PPO's old-policy denominator is the logprob produced by the sampler.
    use_rollout_log_probs_as_old: true
    rollout_logprob_drift_mean_threshold: 0.02
    rollout_logprob_drift_p99_threshold: 0.25
    rollout_importance_ratio_outside_clip_threshold: 0.01
    # A lone raw maximum is diagnostic-only; aggregate and non-finite hard
    # gates remain active. Negative disables this one gate in the trainer.
    rollout_logprob_drift_max_threshold: -1
    # One same-UID/same-rollout retry tolerates a transient env HTTP failure;
    # the group-integrity gate still refuses any incomplete n=8 group.
    max_trajectory_resubmits: 1
    mode: async
    gpu_memory_utilization: 0.35
    n: 8
    log_prob_max_token_len_per_gpu: 32768
    val_kwargs:
      n: 1
      temperature: 0
      top_p: 1.0
      top_k: -1
      do_sample: false
      seed: 2025
    # Preserve the original baseline's 32 outstanding environment workers;
    # each TP1 server admits one sequence at a time via MAX_NUM_SEQS=1.
    max_env_worker: 64
    context_template: linear
    context_template_train_sp_action: false
    max_env_len: 4096
    sparse: true
    context_management:
      enabled: true
      max_prompt_tokens: 22528
      # WS contract: four full turns cover search -> results -> product ->
      # options/buy; older product prose is compacted to 512 tokens.
      recent_turns: 4
      min_recent_turns: 1
      history_observation_max_tokens: 512
      recent_observation_max_tokens: -1
      allow_current_observation_truncation: false
      # Historical hidden reasoning is not replayed by the native Qwen3.5
      # template. Current-turn reasoning still has the full 10K response cap.
      reasoning_history_tokens: 0
      snapshot_training: true
      snapshot_selection: token_weighted
      snapshot_selection_seed: 2025
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 30
      tool_config_path: ''
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 32768

critic:
  ppo_max_token_len_per_gpu: 32768
  forward_max_token_len_per_gpu: 32768

data:
  train_batch_size: 16
  max_prompt_length: 22528
  max_response_length: 10240
  filter_overlong_prompts: true
  truncation: error
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 16
  # Grid eval cadence: smoke-sized slice of the fixed 200-task val profile.
  max_val_tasks: 128
  validation_shuffle: false
  dataloader_num_workers: 0
  val_type: val
  max_train_tasks: 800
  shuffle: true
  seed: 2025
  task_seed: 2026

env_service:
  env_type: webshop
  env_url: http://127.0.0.1:8083
  env_params:
    action_format: react_tags
    enable_action_sanitizer: true
    invalid_action_penalty: -0.05
    invalid_action_penalty_cap: -0.1
    max_consecutive_invalid_actions: 2
    terminate_on_invalid_action: false
    invalid_action_final_reward: -0.1

task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/webshop.json

exp_manager:
  train_rollout_mode: woexp
  val_rollout_mode: woexp
  rollout_ratio: 0
  train_sample_mode: alldiscard
  train_sample_keepratio: 0.0
  experience_template: 'Some Related Experience: <EXP>{}</EXP>'
  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  reme:
    base_url: http://127.0.0.1:8124
    workspace_id: p0_chord_ws_s0
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0
  experience_replay:
    enable: false
  teacher_experience:
    enable: true
    mix_mode: rollout_level
    data_path: /home/qisheng001/DUET_H200/EvolAnalsis/data/teacher_trajectories/iclr2027_flash/webshop_dsv4flash_success_dedup.jsonl
    n_teacher_rollouts_per_task: 1
    # NeurIPS value kept for parity; the v2 file has exactly 1 success/task.
    max_trajectories_per_task: 6
    select_mode: random
    use_log_prob: false
    policy_shaping:
      enable: false
      mode: p_div_p_beta
      beta: 0.1
  state_channel:
    enable: false

attribution_driven_credit_assignment:
  enable: false

thread_pool:
  max_workers: 8

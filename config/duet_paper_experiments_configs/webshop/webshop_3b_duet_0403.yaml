actor_rollout_ref:
  actor:
    clip_ratio_high: 0.28
    dr3:
      alpha_ema_beta: 0.9
      alpha_mode: sync_batch_ema
      apply_min_buf_size: 512
      apply_to: teacher_no_logprob
      apply_warmup_steps: 10
      broadcast_every_n_calls: 1
      broadcast_params: true
      buffer_size: 1024
      clip_max: 5.0
      disc_age_weight_decay: 0.02
      disc_hidden: 64
      disc_label_smoothing: 0.1
      disc_lr: 0.0003
      disc_steps_per_call: 2
      disc_temperature: 2.5
      disc_train_min_buf_size: 256
      disc_weight_decay: 0.005
      dual_enable: true
      dual_init: 0.0
      dual_lr: 0.05
      enable: true
      ess_target_ratio: 0.5
      ess_window: 32
      feature_mode: v3_aug
      gap_gate_enable: false
      hidden_proj_dim: 64
      hidden_proj_dropout: 0.2
      ppo_clip_eps: 0.2
      ratio_shaping_auto_acc_min: 0.8
      ratio_shaping_auto_buf_min: 512
      ratio_shaping_auto_ess_min: 16.0
      ratio_shaping_beta: 0.1
      ratio_shaping_mode: auto
      sync_across_ranks: true
      sync_every_n_calls: 1
      train_batch_size: 128
    entropy_coeff: 0
    fsdp_config:
      optimizer_offload: true
      param_offload: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    loss_agg_mode: token-mean
    off_cliprange_high: 0.6
    optim:
      lr: 1.0e-06
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    teacher_policy_shaping_enable: false
    teacher_use_clip: false
    teacher_use_log_prob: false
    use_chord: false
    use_dapo: false
    use_dr3: true
    use_kl_loss: true
    use_uniform_mix: false
  model:
    enable_gradient_checkpointing: true
    path: /data/code/exp/models/Qwen/Qwen2.5-3B-Instruct
    use_remove_padding: true
  ref:
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 25580
    log_prob_micro_batch_size_per_gpu: 1
  rollout:
    context_template: linear
    context_template_train_sp_action: false
    enable_request_id: false
    gpu_memory_utilization: 0.5
    log_prob_max_token_len_per_gpu: 25580
    log_prob_micro_batch_size_per_gpu: 1
    max_env_len: 4096
    max_env_worker: 32
    max_model_len: 25580
    mode: async
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 30
      tool_config_path: ''
    n: 8
    name: vllm
    prompt_length: 25068
    response_length: 512
    sliding_window_size: 3
    sparse: true
    stop_sequences:
    - </action>
    temperature: 0.6
    tensor_model_parallel_size: 1
    thinking_mode: none
    use_qwen3: false
    val_kwargs:
      n: 1
      stop_sequences:
      - </action>
algorithm:
  adv_estimator: grpo
  dapo:
    dynamic_sampling:
      enable: false
      filter_mode: strict
    enable: false
    overlong_reward_shaping:
      enable: false
      soft_penalty_mode: additive
      truncation_penalty: -0.5
  grpo:
    teacher_baseline_separation:
      enable: true
      non_teacher_baseline: non_teacher_mean
      std_source: non_teacher
      teacher_baseline: all_mean
  use_kl_in_reward: false
attribution_driven_credit_assignment:
  enable: false
critic:
  forward_max_token_len_per_gpu: 25580
  ppo_max_token_len_per_gpu: 25580
data:
  filter_overlong_prompts: true
  max_prompt_length: 1500
  max_response_length: 24080
  max_train_tasks: 800
  return_raw_chat: true
  seed: 2026
  shuffle: true
  train_batch_size: 8
  train_files: null
  truncation: error
  val_batch_size: 8
  val_files: null
  val_type: val
defaults:
- ppo_trainer
- agentevolver
- _self_
env_service:
  env_params:
    action_format: react_tags
    enable_action_sanitizer: true
    invalid_action_final_reward: -0.1
    invalid_action_penalty: -0.05
    invalid_action_penalty_cap: -0.1
    max_consecutive_invalid_actions: 2
    terminate_on_invalid_action: false
  env_type: webshop
  env_url: http://127.0.0.1:8083
exp_manager:
  experience_replay:
    enable: false
  experience_template: '


    Some Related Experience to help you to complete the task:<EXP>{}</EXP>


    '
  init_exp_before_training: false
  init_exp_only: false
  reme:
    base_url: http://127.0.0.1:8124
    enable_context_generator: false
    enable_summarizer: false
    retrieve_top_k: 3
    updated_freq: 0
    workspace_id: webshop_3b_duet
  rollout_ratio: 0
  state_channel:
    beta: 0.2
    beta_decay: false
    enable: true
    exclude_teacher: true
    grpo_decouple: true
    match_mode: stage
    step_level:
      enable: true
      eta: 0.05
  summary_batch_size: 8
  teacher_experience:
    adaptive_weight:
      ema:
        beta: 0.95
        enable: true
      enable: false
      epsilon: 0.0
      gate_level: group
      max: 1.0
      min: 0.0
      mode: gap_linear
      tau: 0.5
    data_path: data/teacher_trajectories/qwen72b/webshop_qwen72b_filtered.pkl
    enable: true
    max_trajectories_per_task: 6
    mix_mode: rollout_level
    n_teacher_rollouts_per_task: 1
    policy_shaping:
      beta: 0.1
      enable: false
      mode: p_div_p_beta
    select_mode: random
    use_log_prob: false
  train_rollout_mode: woexp
  train_sample_keepratio: 0.0
  train_sample_mode: alldiscard
  val_rollout_mode: woexp
hydra:
  searchpath:
  - file://external/config_fallback
  - file://config
task_manager:
  bs: ${data.train_batch_size}
  env_profile: cookbook/env_profiles/webshop.json
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  llm_client: qwen-plus
  mixture:
    shuffle: true
    synthetic_data_ratio: 0.0
    use_original_tasks: true
  n: 0
  num_explore_threads: ${thread_pool.max_workers}
  strategy: random
  strategy_args:
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_k: 100
    exploration_llm_top_p: 1.0
    max_explore_step: 30
    max_llm_retries: 6
  train_data_path: null
  val_data_path: null
thread_pool:
  max_workers: 8
trainer:
  experiment_name: webshop_3b_duet_0403
  logger:
  - console
  - wandb
  n_gpus_per_node: 4
  nnodes: 1
  project_name: agentevolver
  rollout_data_dir: experiments/webshop/webshop_3b_duet_0403/rollout_log
  save_freq: 100
  test_freq: 50
  total_epochs: 1
  val_before_train: false
  validation_data_dir: experiments/webshop/webshop_3b_duet_0403/validation_log

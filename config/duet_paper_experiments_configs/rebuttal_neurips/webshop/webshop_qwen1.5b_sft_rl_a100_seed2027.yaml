hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

trainer:
  experiment_name: webshop_qwen1.5b_sft_rl_a100_seed2027
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 1
  save_freq: 50
  test_freq: 50
  val_before_train: false
  validation_data_dir: experiments/webshop/${trainer.experiment_name}/validation_log
  rollout_data_dir: experiments/webshop/${trainer.experiment_name}/rollout_log
  logger:
  - console
  - wandb
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  grpo:
    teacher_baseline_separation:
      enable: false
      teacher_baseline: all_mean
      non_teacher_baseline: non_teacher_mean
      std_source: non_teacher
  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: strict
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: additive
actor_rollout_ref:
  model:
    path: checkpoints/agentevolver/webshop_qwen1.5b_sft_a100/global_step_50/actor_hf
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1.0e-06
    ppo_micro_batch_size_per_gpu: 2
    ppo_mini_batch_size: 8
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    use_dr3: false
    use_chord: false
    use_uniform_mix: false
    teacher_use_log_prob: false
    teacher_policy_shaping_enable: false
    teacher_use_clip: false
    use_dapo: false
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  rollout:
    use_qwen3: false
    thinking_mode: none
    enable_request_id: false
    prompt_length: 25068
    response_length: 512
    max_model_len: 25580
    temperature: 0.6
    log_prob_micro_batch_size_per_gpu: 2
    tensor_model_parallel_size: 1
    name: vllm
    mode: async
    gpu_memory_utilization: 0.75
    n: 8
    log_prob_max_token_len_per_gpu: 25580
    stop_sequences:
    - </action>
    val_kwargs:
      n: 1
      stop_sequences:
      - </action>
    max_env_worker: 64
    context_template: linear
    context_template_train_sp_action: false
    max_env_len: 4096
    sparse: true
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 30
      tool_config_path: ''
    sliding_window_size: 3
  ref:
    log_prob_micro_batch_size_per_gpu: 2
    fsdp_config:
      param_offload: false
    log_prob_max_token_len_per_gpu: 25580
critic:
  ppo_max_token_len_per_gpu: 25580
  forward_max_token_len_per_gpu: 25580
data:
  train_batch_size: 8
  max_prompt_length: 1500
  max_response_length: 24080
  filter_overlong_prompts: true
  truncation: error
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: val
  max_train_tasks: 400
  shuffle: true
  seed: 2027
  # Same 800 training tasks as the paper's seed-2026 run; only run-time randomness
  # differs. See data/webshop_seed_sensitivity.md.
  task_seed: 2026
env_service:
  env_type: webshop
  env_url: http://127.0.0.1:8083
  env_params:
    action_format: react_tags
    enable_action_sanitizer: true
    invalid_action_penalty: -0.05
    invalid_action_penalty_cap: -0.1
    max_consecutive_invalid_actions: 2
    terminate_on_invalid_action: false
    invalid_action_final_reward: -0.1
task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/webshop.json
exp_manager:
  train_rollout_mode: woexp
  val_rollout_mode: woexp
  rollout_ratio: 0
  train_sample_mode: alldiscard
  train_sample_keepratio: 0.0
  experience_template: '


    Some Related Experience to help you to complete the task:<EXP>{}</EXP>


    '
  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  reme:
    base_url: http://127.0.0.1:8124
    workspace_id: webshop_qwen1.5b_sft_rl_a100_seed2027
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0
  experience_replay:
    enable: false
attribution_driven_credit_assignment:
  enable: false
thread_pool:
  max_workers: 8

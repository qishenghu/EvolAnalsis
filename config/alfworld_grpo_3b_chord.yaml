hydra:
  searchpath:
    - file://external/config_fallback
    - file://config

defaults:
  - ppo_trainer
  - agentevolver
  - _self_

# ============================================================================
# AlfWorld GRPO Training Configuration with CHORD
# ============================================================================
# CHORD (Controllable Harmonization of On- and Off-Policy RL via Dynamic Weighting)
# 
# 核心思想：将 SFT 作为 on-policy RL 的动态加权辅助目标
# 
# 公式：L_chord = (1-μ) * L_grpo + μ * L_sft_weighted
# 其中：
#   - μ: 全局系数，三阶段调度（Warmup → Decay → 稳定）
#   - L_sft_weighted = -∑ φ(d) * log π(y|x)  # 加权 SFT loss
#   - φ(d) = d / (d + δ)  # Token-wise 权重
# 
# 语义解释：
#   - μ 大（训练初期）：更多依赖 SFT loss（学习 expert）
#   - μ 小（训练后期）：更多依赖 GRPO loss（on-policy 探索）
# 
# 与 LUFFY 的区别：
#   - LUFFY: Expert 数据使用 Policy Gradient + p/(p+β) shaping
#   - CHORD: Expert 数据使用 SFT loss + φ(d) + μ 动态衰减
# ============================================================================

trainer:
  experiment_name: alfworld_3b_grpo_chord_bz8_mix1_mu_decay_50
  project_name: agentevolver
  n_gpus_per_node: 4
  nnodes: 1
  total_epochs: 1
  save_freq: 100
  test_freq: 25
  val_before_train: false
  validation_data_dir: "experiments/alfworld/${trainer.experiment_name}/validation_log"
  rollout_data_dir: "experiments/alfworld/${trainer.experiment_name}/rollout_log"
  logger: ["console", "wandb"]

# ============================================================================
# Algorithm Configuration
# ============================================================================
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  # CHORD 可以与 teacher_baseline_separation 配合使用
  grpo:
    teacher_baseline_separation:
      enable: true
      teacher_baseline: "all_mean"
      non_teacher_baseline: "non_teacher_mean"
      std_source: "non_teacher"
  
  dapo:
    enable: false
    dynamic_sampling:
      enable: false
      filter_mode: "strict"
    overlong_reward_shaping:
      enable: false
      truncation_penalty: -0.5
      soft_penalty_mode: "additive"

# ============================================================================
# Model Configuration - Qwen/Qwen2.5-3B-Instruct
# ============================================================================
actor_rollout_ref:
  model:
    path: /data/code/exp/models/Qwen/Qwen2.5-3B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1e-6
    ppo_micro_batch_size_per_gpu: 1
    ppo_mini_batch_size: 8
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    off_cliprange_high: 0.6
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    
    # ⭐ Off-policy Policy Shaping Configuration (Self-generated Experience)
    off_policy_shaping_mode: "exgrpo_policy_shaping"
    off_policy_shaping_beta: 0.1
    
    # ============================================================================
    # ⭐ CHORD Configuration
    # ============================================================================
    # CHORD 模式：使用 SFT loss 学习 expert 数据
    # 与 LUFFY 互斥：启用 CHORD 时，禁用 LUFFY 的 policy_shaping
    # ============================================================================
    use_chord: true
    
    # ============================================================================
    # μ 三阶段调度配置（基于 CHORD 原作者实现）
    # ============================================================================
    # 三阶段调度：Warmup → Decay → 稳定
    # 
    # 1. Warmup 阶段（0 → mu_warmup_steps）：
    #    μ 从 0 线性增长到 mu_peak
    # 
    # 2. Decay 阶段（mu_warmup_steps → mu_warmup_steps + mu_decay_steps）：
    #    μ 从 mu_peak 按余弦曲线平滑衰减到 mu_valley
    # 
    # 3. 稳定阶段（mu_warmup_steps + mu_decay_steps → ∞）：
    #    μ 保持在 mu_valley
    # ============================================================================
    
    # Warmup 阶段步数（chord-mu/chord-phi 可设为 0 跳过 warmup）
    chord_mu_warmup_steps: 0 # original default 200
    
    # Decay 阶段步数
    # - chord-mu: 200
    # - chord-phi: 0（不衰减，保持在 peak）
    chord_mu_decay_steps: 50 # original default 400
    
    # μ 的峰值（Warmup 结束时达到）
    # - chord-mu: 0.9
    # - chord-phi: 0.1
    chord_mu_peak: 0.5
    
    # μ 的谷值/最终值（Decay 结束后保持）
    # - chord-mu: 0.05
    # - chord-phi: 0.1
    chord_mu_valley: 0.02
    
    # ============================================================================
    # φ(d) Token-wise 加权配置
    # ============================================================================
    # φ(d) = d / (d + δ)
    # - delta: 平滑参数（论文默认 0.1）
    # - use_token_weighting: 是否启用 token-wise 加权
    chord_delta: 0.1
    chord_use_token_weighting: true
    
    # ⭐ CHORD 模式下，禁用 LUFFY 的 policy shaping
    # 因为 CHORD 使用 SFT loss 而不是 policy gradient
    teacher_policy_shaping_enable: false
    teacher_use_log_prob: false
    teacher_use_clip: false
    
    use_dapo: false
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    use_qwen3: false
    enable_request_id: false
    prompt_length: 20480
    response_length: 2048
    max_model_len: 25580
    temperature: 0.9
    log_prob_micro_batch_size_per_gpu: 1
    tensor_model_parallel_size: 1
    name: vllm
    mode: async
    gpu_memory_utilization: 0.5
    n: 8
    log_prob_max_token_len_per_gpu: 25580
    val_kwargs:
      n: 1
    max_env_worker: 32
    context_template: "linear"
    context_template_train_sp_action: false
    max_env_len: 4096
    sparse: true
    multi_turn:
      completion_callback: agentevolver.module.trainer.simple_completion_callback.SimpleCompletionCallback
      enable: true
      format: llama3_json
      max_steps: 30
      tool_config_path: ""
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    log_prob_max_token_len_per_gpu: 25580

critic:
  ppo_max_token_len_per_gpu: 25580
  forward_max_token_len_per_gpu: 25580

# ============================================================================
# Data Configuration
# ============================================================================
data:
  train_batch_size: 8
  max_prompt_length: 4000
  max_response_length: 21580
  filter_overlong_prompts: true
  truncation: "error"
  return_raw_chat: true
  train_files: null
  val_files: null
  val_batch_size: 8
  val_type: "val"
  max_train_tasks: 800
  shuffle: true

# ============================================================================
# Environment Service Configuration - AlfWorld
# ============================================================================
env_service:
  env_type: "alfworld"
  env_url: "http://127.0.0.1:8081"

# ============================================================================
# Task Manager Configuration
# ============================================================================
task_manager:
  n: 0
  mixture:
    use_original_tasks: true
    synthetic_data_ratio: 0.0
    shuffle: true
  grader:
    original_grader: env
    synthetic_grader: llm-binary-gt-no_constraint
  strategy: random
  strategy_args:
    max_explore_step: 30
    max_llm_retries: 6
    env_url: ${env_service.env_url}
    exploration_llm_temperature: 1.0
    exploration_llm_top_p: 1.0
    exploration_llm_top_k: 100
  llm_client: qwen-plus
  bs: ${data.train_batch_size}
  num_explore_threads: ${thread_pool.max_workers}
  train_data_path: null
  val_data_path: null
  env_profile: cookbook/env_profiles/alfworld.json

# ============================================================================
# Experience Manager Configuration
# ============================================================================
# ⭐ CHORD 模式配置
#    - 使用预采集的 Expert 轨迹（来自更强的模型如 GPT-4 或 Qwen-72B）
#    - 使用 SFT loss 学习 expert 数据，而非 Policy Gradient
#    - μ(t) 动态衰减，避免 overfitting
# ============================================================================
exp_manager:
  # ============================================================================
  # Experience-Guided Rollout Configuration (DISABLED)
  # ============================================================================
  train_rollout_mode: "woexp"
  val_rollout_mode: "woexp"
  rollout_ratio: 0
  train_sample_mode: "alldiscard"
  train_sample_keepratio: 0.0
  experience_template: "\n\nSome Related Experience to help you to complete the task:<EXP>{}</EXP>\n\n"
  
  # ============================================================================
  # Experience Summarization Configuration (DISABLED)
  # ============================================================================
  init_exp_before_training: false
  init_exp_only: false
  summary_batch_size: 8
  reme:
    base_url: "http://127.0.0.1:8124"
    workspace_id: "alfworld_3b_grpo_chord"
    enable_summarizer: false
    enable_context_generator: false
    retrieve_top_k: 3
    updated_freq: 0
  
  # ============================================================================
  # Self-Generated Experience Replay Configuration (DISABLED)
  # ============================================================================
  experience_replay:
    enable: false
    replay_start_ratio: 0.1
    exp_ratio: 0.0
    offpolicy_trajectories_per_task: 1
    experience_lbound: 2
    experience_rbound: 8
    exp_select_mode: "argmin"
    use_current_policy_entropy: true
    exp_is_correct: true
    max_trajectories_per_task: 5
  
  # ============================================================================
  # Teacher Experience Replay Configuration (ENABLED for CHORD)
  # ============================================================================
  # ⭐ CHORD 复用 LUFFY 的数据加载机制
  #    - 数据来源相同：使用 teacher_experience 加载 expert 轨迹
  #    - Loss 不同：CHORD 使用 SFT loss，LUFFY 使用 Policy Gradient
  # ============================================================================
  teacher_experience:
    # ⭐ 主开关：启用 Teacher/Expert Experience
    enable: true
    
    # ⭐ 混合模式：CHORD 使用 rollout_level 混合
    mix_mode: "rollout_level"
    
    # ⭐ Expert 轨迹数据路径（JSONL 或 PKL 格式）
    data_path: "data/teacher_trajectories/qwen72b/alfworld_qwen72b_filtered.pkl"
    
    # ⭐ 每个 task 混入的 expert rollout 数量
    n_teacher_rollouts_per_task: 1
    
    # 每个 task 最多存储的 Expert 轨迹数量
    max_trajectories_per_task: 6
    
    # 轨迹选择模式
    select_mode: "random"
    
    # ⭐ CHORD 不需要 log_prob（使用当前策略计算）
    use_log_prob: false
    
    # ⭐ CHORD 不使用 policy shaping（使用 SFT loss 代替）
    policy_shaping:
      enable: false
      mode: "p_div_p_beta"
      beta: 0.1

    # 2.2 (optional): adaptive teacher loss gating
    adaptive_weight:
      enable: false

# ============================================================================
# Attribution-Driven Credit Assignment (ADCA-GRPO) Configuration
# ============================================================================
attribution_driven_credit_assignment:
  enable: false

# ============================================================================
# Thread Pool Configuration
# ============================================================================
thread_pool:
  max_workers: 8
